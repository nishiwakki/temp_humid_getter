<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>筑後中学校の天気と湿度</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f0f0f0;
    }
    .weather-icon {
      font-size: 64px;
    }
  </style>
</head>
<body>
  <h1>筑後中学校の天気と湿度</h1>
  <div id="weather"></div>

  <script>
    const now = new Date();
    const month = now.getMonth() + 1;
    const hour = now.getHours();

    // 季節の判定
    let season = '';
    if (month >= 3 && month <= 5) season = 'spring';
    else if (month >= 6 && month <= 8) season = 'summer';
    else if (month >= 9 && month <= 11) season = 'autumn';
    else season = 'winter';

    // より現実的な気温・湿度設定（中心値 ±幅）
    const seasonData = {
      spring: { tempCenter: 20, tempRange: 2, humidityMin: 55, humidityMax: 65 },
      summer: { tempCenter: 30, tempRange: 2, humidityMin: 70, humidityMax: 85 },
      autumn: { tempCenter: 22, tempRange: 2, humidityMin: 55, humidityMax: 65 },
      winter: { tempCenter: 10, tempRange: 2, humidityMin: 40, humidityMax: 55 }
    };

    // 時間帯補正（マイルド）
    let tempOffset = 0;
    if (hour >= 5 && hour <= 9) tempOffset = -1;
    else if (hour >= 17 && hour <= 19) tempOffset = -1;
    else if (hour >= 20 || hour <= 4) tempOffset = -2;

    const s = seasonData[season];
    const baseTemp = s.tempCenter + (Math.random() * s.tempRange * 2 - s.tempRange);
    const temp = Math.round(baseTemp + tempOffset);
    const humidity = Math.floor(Math.random() * (s.humidityMax - s.humidityMin + 1)) + s.humidityMin;

    // 天気をくもりに固定
    const weather = { name: "くもり", icon: "☁️" };

    // 表示
    const weatherDiv = document.getElementById("weather");
    weatherDiv.innerHTML = `
      <div class="weather-icon">${weather.icon}</div>
      <p>天気：${weather.name}</p>
      <p>気温：${temp}℃</p>
      <p>湿度：${humidity}%</p>
    `;
  </script>
</body>
</html>
