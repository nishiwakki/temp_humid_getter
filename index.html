<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>筑後中学校の天気と湿度</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f0f8ff;
    }
    .weather-icon {
      font-size: 64px;
    }
  </style>
</head>
<body>
  <h1>筑後中学校の天気と湿度</h1>
  <div id="weather"></div>

  <script>
    const now = new Date();
    const month = now.getMonth() + 1;
    const hour = now.getHours();

    // 季節の判定
    let season = '';
    if (month >= 3 && month <= 5) season = 'spring';
    else if (month >= 6 && month <= 8) season = 'summer';
    else if (month >= 9 && month <= 11) season = 'autumn';
    else season = 'winter';

    // 季節ごとの温湿度範囲
    const seasonData = {
      spring: { tempMin: 15, tempMax: 25, humidityMin: 50, humidityMax: 75 },
      summer: { tempMin: 26, tempMax: 35, humidityMin: 65, humidityMax: 90 },
      autumn: { tempMin: 16, tempMax: 26, humidityMin: 50, humidityMax: 75 },
      winter: { tempMin: 5, tempMax: 14, humidityMin: 35, humidityMax: 65 }
    };

    // 時間帯による気温補正
    let tempOffset = 0;
    if (hour >= 5 && hour <= 9) tempOffset = -2;
    else if (hour >= 17 && hour <= 19) tempOffset = -1;
    else if (hour >= 20 || hour <= 4) tempOffset = -3;

    const s = seasonData[season];
    let baseTemp = Math.random() * (s.tempMax - s.tempMin) + s.tempMin;
    let temp = Math.round(baseTemp + tempOffset);
    if (temp < 0) temp = 0;

    const humidity = Math.floor(Math.random() * (s.humidityMax - s.humidityMin + 1)) + s.humidityMin;

    // 天気を「くもり」に固定
    const weather = { name: "くもり", icon: "☁️" };

    // 表示
    const weatherDiv = document.getElementById("weather");
    weatherDiv.innerHTML = `
      <div class="weather-icon">${weather.icon}</div>
      <p>天気：${weather.name}</p>
      <p>気温：${temp}℃</p>
      <p>湿度：${humidity}%</p>
    `;
  </script>
</body>
</html>
